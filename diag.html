<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EcoHydroLab — diagnostics</title>
<style>
  body { font-family: ui-monospace, Menlo, monospace; max-width: 820px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #16232a; }
  h1 { font-family: Georgia, serif; }
  .ok { color: #1a7f4b; }
  .bad { color: #b23b3b; }
  pre { background: #f4f2ec; padding: 1rem; border-radius: 4px; overflow: auto; white-space: pre-wrap; }
  .step { border-left: 3px solid #ccc; padding-left: 1rem; margin: 1.2rem 0; }
</style>
</head>
<body>
<h1>Publications loading diagnostics</h1>
<p>This page tests each step of loading <code>data/publications.json</code> and reports what happens.</p>
<div id="out"></div>

<script>
const out = document.getElementById('out');
function log(label, cls, detail) {
  const div = document.createElement('div');
  div.className = 'step';
  div.innerHTML = '<strong class="' + cls + '">' + label + '</strong>' + (detail ? '<pre>' + detail + '</pre>' : '');
  out.appendChild(div);
}

(async function () {
  const path = 'data/publications.json';

  // Step 1: fetch
  let res;
  try {
    res = await fetch(path);
  } catch (e) {
    log('✗ STEP 1 — fetch failed (network/path).', 'bad', e.message);
    return;
  }
  log('✓ STEP 1 — fetch reached the server. HTTP status: ' + res.status, res.ok ? 'ok' : 'bad');

  if (!res.ok) {
    log('✗ File not served (HTTP ' + res.status + '). Check the exact path and letter-case: it must be data/publications.json, all lowercase.', 'bad');
    return;
  }

  // Step 2: content type (catches case where GitHub serves HTML 404 page as 200)
  const ct = res.headers.get('content-type') || '(none)';
  log('• STEP 2 — Content-Type returned: ' + ct, ct.includes('json') || ct.includes('text') ? 'ok' : 'bad');

  // Step 3: read raw text
  const text = await res.text();
  log('✓ STEP 3 — file length: ' + text.length + ' characters. First 200 chars below:', 'ok', text.slice(0, 200));

  // Step 3b: detect smart quotes / BOM
  const hasSmart = /[\u201C\u201D\u2018\u2019]/.test(text);
  const hasBOM = text.charCodeAt(0) === 0xFEFF;
  if (hasSmart) log('✗ Found “smart/curly quotes” in the file — these break JSON. Replace with straight " quotes.', 'bad');
  if (hasBOM)   log('✗ File begins with a BOM character — can break parsing. Re-save as UTF-8 without BOM.', 'bad');

  // Step 4: parse
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    log('✗ STEP 4 — JSON.parse FAILED. This is the problem.', 'bad', e.message);
    return;
  }
  log('✓ STEP 4 — JSON parsed successfully.', 'ok');

  // Step 5: shape
  if (!Array.isArray(data)) {
    log('✗ STEP 5 — parsed data is not an array. Type is: ' + typeof data, 'bad');
    return;
  }
  log('✓ STEP 5 — data is an array with ' + data.length + ' entries.', 'ok');
  log('✓ ALL CHECKS PASSED. If the real page is still blank, the issue is that main.js is not defining renderPublications (check assets/js/main.js loaded, HTTP 200, no syntax error in console).', 'ok',
      'First entry: ' + JSON.stringify(data[0], null, 2));
})();
</script>
</body>
</html>
